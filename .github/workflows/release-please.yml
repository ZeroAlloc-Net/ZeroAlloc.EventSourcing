name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest mode: read release-please-config.json + .release-please-manifest.json
          # from the repo root. A single root component covers every package, so one
          # version and one tag (ZeroAlloc.EventSourcing-v1.2.1) cover the whole release
          # and every commit is attributed to something. See docs/releasing.md.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    services:
      sql-server:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          dotnet-quality: 'ga'

      - name: Wait for databases to start
        run: sleep 15

      - name: Create test databases
        run: |
          docker exec $(docker ps -f name=postgres -q) psql -U postgres -c "CREATE DATABASE test;" || true
          docker exec $(docker ps -f name=mssql -q) /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourPassword123! -N -C -Q "CREATE DATABASE test;" || true

      - name: Restore
        run: dotnet restore ZeroAlloc.EventSourcing.slnx

      - name: Build
        run: dotnet build ZeroAlloc.EventSourcing.slnx -c Release --no-restore -p:Version=${{ needs.release-please.outputs.version }}

      - name: Test
        run: dotnet test ZeroAlloc.EventSourcing.slnx -c Release --no-build --filter "FullyQualifiedName!~SqlServer&FullyQualifiedName!~PostgreSql"

      # One version covers every package. Under the old per-package components,
      # -p:PackageVersion applied globally, so each sibling stamped its OWN number onto the
      # ZeroAlloc.EventSourcing ProjectReference -- .Mediator 1.0.1 shipped "depends on
      # ZeroAlloc.EventSourcing >= 1.0.1", a version that does not exist. See docs/releasing.md.
      - name: Pack all packages at the release version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::release-please reported a release but produced no version"
            exit 1
          fi
          mkdir -p ./nupkg
          for csproj in src/*/*.csproj; do
            # Most projects do not declare IsPackable and default to packable, so exclude
            # explicitly-unpackable ones rather than requiring an opt-in.
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj at $VERSION"
            dotnet pack "$csproj" -c Release --no-build -p:PackageVersion="$VERSION" -o ./nupkg
          done
          ls -la ./nupkg
          # Releasing nothing while reporting success is the failure mode this prevents.
          if ! ls ./nupkg/*.nupkg >/dev/null 2>&1; then
            echo "::error::no packages were produced"
            exit 1
          fi


      - name: Verify generator pack layout
        run: ./scripts/verify-generator-pack-layout.sh ./nupkg

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # One release per run now, so every package attaches to the same tag.
          echo "Uploading $(ls ./nupkg/*.nupkg | wc -l) packages to release $TAG"
          gh release upload "$TAG" ./nupkg/*.nupkg --clobber
