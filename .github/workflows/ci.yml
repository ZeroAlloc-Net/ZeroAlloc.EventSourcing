name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    services:
      sql-server:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourPassword123!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
      - name: Wait for databases to start
        run: sleep 15
      - name: Create test databases
        run: |
          # Create PostgreSQL test database
          docker exec $(docker ps -f name=postgres -q) psql -U postgres -c "CREATE DATABASE test;" || true
          # Create SQL Server test database (disable encryption due to self-signed certs in container)
          docker exec $(docker ps -f name=mssql -q) /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourPassword123! -N -C -Q "CREATE DATABASE test;" || true
      - name: Restore
        run: dotnet restore ZeroAlloc.EventSourcing.slnx
      # The dry-run pack below uses --no-build, so this build must carry the version it packs at.
      # Without it the assemblies were stamped 1.0.0.0 while the packages claimed 0.0.0-dryrun;
      # the version guard in Directory.Build.props fails such a pack. See ZeroAlloc-Net/.github#36.
      - name: Build
        run: dotnet build ZeroAlloc.EventSourcing.slnx --no-restore --configuration Release -p:Version=0.0.0-dryrun
      - name: Test
        run: dotnet test ZeroAlloc.EventSourcing.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory ./TestResults --filter "FullyQualifiedName!~SqlServer&FullyQualifiedName!~PostgreSql"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
      # Discovered as release-please.yml does, not listed: the old hardcoded list of ten had
      # already missed Outbox and Sqlite, so the dry-run never packed two shipped packages.
      - name: Verify pack (dry-run, every packable src project)
        run: |
          set -euo pipefail
          mkdir -p ./nupkg-dryrun
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj..."
            dotnet pack "$csproj" -c Release --no-build -p:Version=0.0.0-dryrun -o ./nupkg-dryrun
          done
          ls -la ./nupkg-dryrun
      - name: Verify generator pack layout
        run: ./scripts/verify-generator-pack-layout.sh ./nupkg-dryrun

  aot-smoke:
    name: aot-smoke
    runs-on: ubuntu-latest
    # Publishes samples/ZeroAlloc.EventSourcing.AotSmoke with PublishAot=true.
    # Exercises the generator + Aggregate<TId,TState> flow: Raise() + ApplyEvent()
    # + DequeueUncommitted. Doesn't require a database, keeping the smoke fast.
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Restore
        run: dotnet restore samples/ZeroAlloc.EventSourcing.AotSmoke/ZeroAlloc.EventSourcing.AotSmoke.csproj
      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.EventSourcing.AotSmoke/ZeroAlloc.EventSourcing.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out
      - name: Run AOT binary
        run: ./aot-out/ZeroAlloc.EventSourcing.AotSmoke

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
