name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
      - name: Restore
        run: dotnet restore ZeroAlloc.EventSourcing.slnx
      # The dry-run pack below uses --no-build, so this build must carry the version it packs at.
      # Without it the assemblies were stamped 1.0.0.0 while the packages claimed 0.0.0-dryrun;
      # the version guard in Directory.Build.props fails such a pack. See ZeroAlloc-Net/.github#36.
      - name: Build
        run: dotnet build ZeroAlloc.EventSourcing.slnx --no-restore --configuration Release -p:Version=0.0.0-dryrun
      # The SQL Server, PostgreSQL and Kafka tests start their own containers through
      # Testcontainers, the same way they run locally; the runner's Docker is all they need.
      # No LogFileName: a fixed name made every test project overwrite the same results.trx,
      # so the uploaded artifact held only the last project's results.
      - name: Test
        run: dotnet test ZeroAlloc.EventSourcing.slnx --no-build --configuration Release --logger trx --results-directory ./TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
      # Discovered as release-please.yml does, not listed: the old hardcoded list of ten had
      # already missed Outbox and Sqlite, so the dry-run never packed two shipped packages.
      - name: Verify pack (dry-run, every packable src project)
        run: |
          set -euo pipefail
          mkdir -p ./nupkg-dryrun
          for csproj in src/*/*.csproj; do
            if grep -q "<IsPackable>false</IsPackable>" "$csproj"; then
              echo "Skipping $csproj (not packable)"
              continue
            fi
            echo "Packing $csproj..."
            dotnet pack "$csproj" -c Release --no-build -p:Version=0.0.0-dryrun -o ./nupkg-dryrun
          done
          ls -la ./nupkg-dryrun
      - name: Verify generator pack layout
        run: ./scripts/verify-generator-pack-layout.sh ./nupkg-dryrun

  aot-smoke:
    name: aot-smoke
    runs-on: ubuntu-latest
    # A hang in a NativeAOT binary must fail the job, not hold the runner for six hours.
    timeout-minutes: 45
    # Publishes every samples/*AotSmoke project with PublishAot=true and runs the binary.
    # They were listed by hand before, and the list only ever held the first one, so the
    # Mediator, Outbox and Sqlite smokes added later were never run at all. Discovery keeps
    # a new smoke from being left out the same way.
    # One job rather than a matrix: aot-smoke is a required check on main, and a matrix
    # would report under per-leg names instead.
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Installs the SDK global.json pins. Without it the job never installs
          # that SDK at all and only works when the runner image happens to ship one
          # satisfying the pin, which is how a publish failed on a lagging image.
          global-json-file: global.json
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
      - name: Install AOT native toolchain
        # NativeAOT links with clang and the zlib headers. The runner image ships clang, so apt
        # runs only for what is missing. apt has no network timeout of its own: a stalled mirror
        # used to hang this step until the job timed out. See ZeroAlloc-Net/.github#47.
        timeout-minutes: 5
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -z "$missing" ]; then
            echo "clang and zlib1g-dev are already installed"
            exit 0
          fi
          echo "Installing:$missing"
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y $missing
      - name: Publish and run every AOT smoke
        run: |
          set -uo pipefail
          shopt -s nullglob
          projects=(samples/*AotSmoke/*.csproj)
          if [ ${#projects[@]} -eq 0 ]; then
            echo "::error::No samples/*AotSmoke projects found"
            exit 1
          fi
          echo "Found ${#projects[@]} AOT smoke projects"
          failed=()
          for csproj in "${projects[@]}"; do
            name=$(basename "$csproj" .csproj)
            out="./aot-out/$name"
            echo "::group::$name"
            if ! dotnet publish "$csproj" -r linux-x64 -c Release -o "$out"; then
              echo "::endgroup::"
              echo "::error::$name failed to publish"
              failed+=("$name: publish")
              continue
            fi
            # 124 means timeout killed it: a hang, which only shows up under NativeAOT.
            timeout 120 "$out/$name"
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 124 ]; then
              echo "::error::$name hung and was killed after 120s"
              failed+=("$name: timed out")
            elif [ $rc -ne 0 ]; then
              echo "::error::$name exited with $rc"
              failed+=("$name: exit $rc")
            else
              echo "$name passed"
            fi
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi

  # A release PR must mark everything it releases as shipped: the analyzer rules in
  # AnalyzerReleases.Unshipped.md and the API in every PublicAPI.Unshipped.txt. The
  # ship-release-tracking job in release-please.yml commits that move onto the branch;
  # this fails the PR if the move is missing, or if a later commit on the branch adds
  # entries after it. Shared from ZeroAlloc-Net/.github; see ZeroAlloc-Net/.github#38.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
